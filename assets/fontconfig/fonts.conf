<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  O container nix nao traz /etc/fonts/fonts.conf, e sem ele o libass reclama
  ("Cannot load default config file") e cai num provedor sem fonte alguma.
  Esta config minima aponta para as fontes do projeto e para as do sistema.
-->
<fontconfig>
  <dir>/app/assets/fonts</dir>
  <dir>/nix/store</dir>
  <dir>/usr/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>

  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
